[package]
name = "classhub"
version = "0.1.0"
description = "Local study hub for a semester of coursework"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "classhub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` is what frames a PDF in the viewer (SPEC §12); its scope is
# the AIBHS root, granted at runtime by `allow_asset_root`.
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
anyhow = "1.0.104"
dirs = "6.0.0"
sha2 = "0.11.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "native-tls"] }
keyring = { version = "4.1.6", default-features = false, features = ["v1"] }
# Canvas returns due dates in UTC and the app stores local wall-clock time
# (SPEC §5). A fixed offset cannot do that conversion: this semester's
# assignments straddle the DST change, and for a 23:59 deadline an hour's
# error is a whole day. Already in the tree via tauri, so this costs no
# additional crate.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Canvas refuses a file download issued outside its own page, so the bytes come
# back base64 from an in-page fetch (SPEC §7.2). Already in the tree via tauri.
base64 = "0.22"

# Startup recovery asks the kernel whether the process that owns a job row is
# still there (`kill(pid, 0)`), since the installed app and a dev build share
# one database (SPEC §13). Already in the tree via tauri.
libc = "0.2"

# The shift's two notifications (SPEC §6) and the login item (§12): the app's
# own bundle id on the notification, and a LaunchAgent for the login item,
# which needs no automation permission.
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
